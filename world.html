<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계 로또 번호 생성기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap wrap-world">
    <header>
      <button id="theme-toggle" class="theme-toggle" aria-label="다크/화이트 모드 전환" title="다크/화이트 모드 전환">
        <span id="theme-toggle-icon">🌙</span>
        <span id="theme-toggle-label">Darkmode</span>
      </button>
      <h1 data-i18n="worldTitle">🌍 세계 로또 번호 생성기</h1>
      <p class="subtitle" data-i18n="worldSubtitle">세계 각국의 복권 규칙에 맞춰 번호를 무작위로 뽑아드려요</p>
    </header>

    <div class="main-row">
      <section class="controls">
        <div class="control-row">
          <label for="game" data-i18n="gameLabel">국가 / 게임</label>
          <select id="game"></select>
        </div>

        <div class="control-row">
          <label for="count" data-i18n="countLabel">생성 게임 수</label>
          <select id="count"></select>
        </div>

        <div class="control-row">
          <label for="exclude" data-i18n="excludeLabel">제외할 번호 (선택)</label>
          <input type="text" id="exclude" data-i18n-placeholder="excludePlaceholder" placeholder="예: 1, 7, 23">
        </div>
        <p id="exclude-hint" class="exclude-hint" data-i18n="excludeFormatHint" hidden>쉼표(,) 뒤에 띄어쓰기를 넣어주세요. 예: 1, 7, 23</p>

        <p id="game-info" class="game-info"></p>

        <button id="generate" class="generate-btn" data-i18n="generateBtn">번호 생성하기</button>
      </section>

      <div id="quick-flags" class="quick-flags"></div>
    </div>

    <section id="results" class="results"></section>

    <footer>
      <p data-i18n="footerNote">재미로 즐기는 번호 생성기입니다. 당첨을 보장하지 않아요 🍀</p>
      <p><a href="index.html" data-i18n="backLink">🇰🇷 한국 로또 생성기로 돌아가기</a></p>
      <p><a href="partnership.html" data-i18n="partnershipLink">제휴 문의하기 →</a></p>
    </footer>
  </div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="i18n.js"></script>
<script src="games.js"></script>
<script src="theme.js"></script>
<script src="celebrate.js"></script>
<script src="world.js"></script>
</body>
</html>
