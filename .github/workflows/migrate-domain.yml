name: Migrate domain to luckyturtle.life

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace old domain everywhere
        run: |
          grep -rIl 'lottopick\.org' . --exclude-dir=.git | xargs -r sed -i 's/lottopick\.org/luckyturtle.life/g'

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Switch canonical domain from lottopick.org to luckyturtle.life"
            git push
          fi
